---
steamroller_environment: dev
steamroller_registration_mode: auto
steamroller_expected_satellite_server: ""
steamroller_expected_consumer_name: ""
steamroller_expected_organization: ""
steamroller_expected_lifecycle_environment: ""
steamroller_expected_content_view: ""
steamroller_cluster_check_enabled: false

# Development default. The RPM configuration overrides this with
# /var/lib/steamroller/reports.
steamroller_report_root: "{{ playbook_dir }}/../reports"

steamroller_disk_warning_percent: 80
steamroller_disk_critical_percent: 95
steamroller_root_min_free_mb: 4096
steamroller_boot_min_free_mb: 400
steamroller_inode_warning_percent: 80
steamroller_inode_failure_percent: 95
steamroller_uptime_warning_days: 30
steamroller_uptime_high_days: 90
steamroller_uptime_critical_days: 200
steamroller_required_repositories: []
steamroller_allowed_repo_files:
  - redhat.repo
steamroller_custom_repo_policy: fail
steamroller_critical_services: []
steamroller_application_services: []
